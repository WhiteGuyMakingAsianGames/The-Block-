<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smiling Block Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        header, footer {
            text-align: center;
            margin: 10px;
        }
        #gameCanvas {
            border: 1px solid #000;
        }
        #instructions {
            margin: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smiling Block Game</h1>
    </header>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <section id="instructions">
        <h2>Game Instructions</h2>
        <p>Use the arrow keys to move your player. Click on bushes to enter the bush world.</p>
    </section>
    <footer>
        <p>&copy; 2025 WhiteGuyMakingAsianGames</p>
    </footer>
    <script src="game.js"></script>
</body>
</html>
